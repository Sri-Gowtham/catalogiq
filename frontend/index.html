<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CatalogIQ: audit and enrich supplier product data before any AI is spent on it." />
    <meta name="theme-color" content="#f6f9fc" />
    <title>CatalogIQ</title>
      <script>
      // apply the saved theme before the page paints, so a dark choice never flashes white
      try {
        var t = localStorage.getItem('catalogiq.theme')
        if (t === 'dark' || ((t !== 'light') && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
